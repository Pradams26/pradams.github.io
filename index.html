<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wafiq Hasan — Portfolio</title>
<style>
  :root{
    --bg: #ffffff;
    --ink: #111111;
    --yellow: #ffd43a;
    --yellow-soft: #fff4c2;
    --blue: #4aa8ff;
    --blue-deep: #1a56db;
    --red: #e8354a;
    --purple: #7b3fe4;
    --grey: #e7e7e7;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    overflow-x:hidden;
  }

  /* NAV */
  nav{
    display:flex;
    justify-content:center;
    padding: 28px 20px 0;
  }
  .nav-pill{
    display:flex;
    align-items:center;
    gap:6px;
    background: var(--yellow);
    border-radius: 999px;
    padding:6px;
  }
  .nav-pill a{
    text-decoration:none;
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 999px;
  }
  .nav-pill a.active{
    background: #fff;
  }
  .theme-toggle{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    cursor:pointer;
    border:none;
    margin-left:2px;
  }

  /* HERO */
  .hero{
    max-width: 900px;
    margin: 70px auto 0;
    padding: 0 20px;
    text-align:center;
  }
  .hero h1{
    font-size: 42px;
    line-height: 1.35;
    font-weight: 500;
    margin: 0;
  }
  .hero .avatar{
    display:inline-block;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    vertical-align: middle;
    margin: 0 6px;
    background: linear-gradient(160deg,#3a3a3a,#111 60%, var(--yellow) 100%);
    position:relative;
    overflow:hidden;
  }
  .hero .avatar::after{
    content:"🧑🏻";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
  }
  .hero .eyes{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width: 46px;
    height: 44px;
    border-radius: 12px;
    vertical-align: middle;
    margin: 0 6px;
    background: var(--blue);
    font-size: 20px;
  }

  .cta{
    display:inline-block;
    margin-top: 34px;
    background: var(--ink);
    color:#fff;
    border:none;
    font-size: 16px;
    font-weight: 600;
    padding: 15px 30px;
    border-radius: 999px;
    cursor:pointer;
  }

  /* COLLAGE */
  .collage-wrap{
    position:relative;
    max-width: 1100px;
    margin: 90px auto 0;
    padding: 0 20px 60px;
  }
  .collage{
    position:relative;
    height: 300px;
  }
  .piece{
    position:absolute;
    box-shadow: 0 18px 35px rgba(0,0,0,0.14);
  }

  /* circular swirl */
  .swirl{
    left: 0;
    bottom: 0;
    width: 210px;
    height: 210px;
    border-radius: 50%;
    background: #ececec;
    display:flex;
    align-items:center;
    justify-content:center;
    transform: rotate(-6deg);
  }
  .swirl-inner{
    width: 165px;
    height: 165px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #7fd8c9, transparent 55%),
      radial-gradient(circle at 65% 70%, #0b3d4a, transparent 60%),
      linear-gradient(135deg,#0e5c66,#1c8f8c 45%, #cfeee0 100%);
  }

  /* polaroid */
  .polaroid{
    left: 150px;
    bottom: 40px;
    width: 155px;
    background: #fff;
    padding: 10px 10px 34px;
    transform: rotate(-8deg);
    border-radius: 2px;
  }
  .polaroid .photo{
    width:100%;
    height: 150px;
    border-radius: 1px;
    background: linear-gradient(180deg,#cfcfcf,#8a8a8a 40%, #444 100%);
    position:relative;
    overflow:hidden;
  }
  .polaroid .photo::after{
    content:"🧑🏻‍🦱";
    position:absolute;
    inset:0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    font-size:70px;
    filter: grayscale(0.2);
  }
  .clip{
    position:absolute;
    top: -18px;
    left: 62px;
    width: 26px;
    height: 44px;
    border: 4px solid #c7c7c7;
    border-radius: 14px;
    transform: rotate(18deg);
    background: transparent;
  }

  /* sticky note */
  .sticky{
    left: 285px;
    bottom: 20px;
    width: 195px;
    height: 235px;
    background: var(--yellow-soft);
    padding: 20px 16px;
    transform: rotate(4deg);
    font-size: 14.5px;
    line-height: 1.5;
    color: #2b2b2b;
  }
  .sticky .leaf{
    font-size:14px;
  }

  /* blue folder */
  .folder{
    left: 470px;
    bottom: 0;
    width: 210px;
    height: 220px;
  }
  .folder-back{
    position:absolute;
    inset:0;
    top: 10px;
    background: var(--blue);
    border-radius: 18px 18px 4px 4px;
    transform: rotate(-4deg);
  }
  .folder-front{
    position:absolute;
    left: -6px;
    right: -6px;
    bottom: -10px;
    height: 160px;
    background: var(--blue);
    border-radius: 16px 16px 22px 22px;
    transform: rotate(2deg);
  }
  .card-stack{
    position:absolute;
    inset:0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:6px;
    padding-bottom: 26px;
  }
  .mini-card{
    width: 60px;
    height: 130px;
    border-radius: 8px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.18);
  }
  .mc1{ background: var(--red); transform: rotate(-10deg); display:flex; align-items:flex-end; padding:10px 6px; color:#fff; font-weight:800; font-style: italic; font-size: 15px;}
  .mc2{ background: linear-gradient(160deg,#1c1c1c,#3a3a3a); transform: rotate(-2deg); }
  .mc3{ background: linear-gradient(160deg,#2b2d86,#4a4ecf); transform: rotate(6deg); }
  .mc4{ background: var(--purple); transform: rotate(13deg); }

  /* stamp photo */
  .stamp{
    right: 0;
    bottom: 10px;
    width: 170px;
    height: 225px;
    background: var(--yellow);
    clip-path: polygon(
      2% 4%,6% 0,10% 4%,14% 0,18% 4%,22% 0,26% 4%,30% 0,34% 4%,38% 0,42% 4%,46% 0,50% 4%,54% 0,58% 4%,62% 0,66% 4%,70% 0,74% 4%,78% 0,82% 4%,86% 0,90% 4%,94% 0,98% 4%,
      98% 96%,94% 100%,90% 96%,86% 100%,82% 96%,78% 100%,74% 96%,70% 100%,66% 96%,62% 100%,58% 96%,54% 100%,50% 96%,46% 100%,42% 96%,38% 100%,34% 96%,30% 100%,26% 96%,22% 100%,18% 96%,14% 100%,10% 96%,6% 100%,2% 96%
    );
    padding: 14px;
    transform: rotate(5deg);
  }
  .stamp-photo{
    width:100%;
    height:100%;
    border-radius: 2px;
    background: radial-gradient(circle at 30% 20%, #9fd88a, transparent 50%), linear-gradient(180deg,#3f6b2f,#274a1e 70%, #16321a);
  }

  .glow{
    position:absolute;
    left:0;right:0;
    bottom:-40px;
    height: 160px;
    background: radial-gradient(60% 100% at 30% 0%, rgba(255,212,58,0.55), transparent 70%),
                radial-gradient(50% 100% at 70% 0%, rgba(74,168,255,0.5), transparent 70%);
    filter: blur(10px);
    z-index:-1;
  }

  footer{
    text-align:center;
    padding: 20px 0 50px;
    font-size: 14px;
    color: #6b6b6b;
  }

  @media (max-width: 900px){
    .hero h1{ font-size: 28px; }
    .collage{ transform: scale(0.55); transform-origin: top left; height: 180px; width: 182%; }
  }
</style>
</head>
<body>

  <nav>
    <div class="nav-pill">
      <a href="#" class="active">Home</a>
      <a href="#">Work</a>
      <a href="#">About</a>
      <button class="theme-toggle" aria-label="Toggle theme">☀️</button>
    </div>
  </nav>

  <section class="hero">
    <h1>
      Hi! I am Wafiq
      <span class="avatar" aria-hidden="true"></span>
      A Multidiscplinary designer 🖍️
      based in Jakarta
      <span class="eyes" aria-hidden="true">👀</span>
      I believe in form follows function and a little bit of fun 🌲
    </h1>
    <button class="cta">Let's Collaborate!</button>
  </section>

  <div class="collage-wrap">
    <div class="collage">
      <div class="glow"></div>

      <div class="piece swirl">
        <div class="swirl-inner"></div>
      </div>

      <div class="piece polaroid">
        <div class="clip"></div>
        <div class="photo"></div>
      </div>

      <div class="piece sticky">
        There's something about not having figured out yet, it feels confusing <span class="leaf">🌱</span> sometimes still figuring things out
      </div>

      <div class="piece folder">
        <div class="folder-back"></div>
        <div class="folder-front"></div>
        <div class="card-stack">
          <div class="mini-card mc2"></div>
          <div class="mini-card mc3"></div>
          <div class="mini-card mc1">olidia</div>
          <div class="mini-card mc4"></div>
        </div>
      </div>

      <div class="piece stamp">
        <div class="stamp-photo"></div>
      </div>
    </div>
  </div>

  <footer>©2026 Wafiq Hasan</footer>

</body>
</html>
