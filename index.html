  .hero__scrim{
    position:absolute;
    inset:0;
    z-index:-2;
    background:
      linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 60%, rgba(0,0,0,.35) 100%);
  }

  .hero__grain{
    position:absolute;
    inset:0;
    z-index:-1;
    opacity:.18;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:160px 160px;
  }

  /* NAV */
  nav{
    position:relative;
    z-index:5;
    width:min(680px, 90%);
    margin-top:34px;
    background:#fff;
    border-radius:999px;
    padding:8px 8px 8px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 8px 24px rgba(0,0,0,.28);
  }

  .brand{
    color:#141311;
    font-size:.98rem;
    white-space:nowrap;
  }
  .brand strong{font-weight:700;}
  .brand span{font-weight:400; color:#4a4a4a;}

  .nav-links{
    display:flex;
    align-items:center;
    gap:2px;
  }
  .nav-links a{
    text-decoration:none;
    color:#1a1a1a;
    font-size:.92rem;
    font-weight:500;
    padding:8px 16px;
    border-radius:999px;
    transition:background .2s ease;
    white-space:nowrap;
  }
  .nav-links a.active{
    background:var(--yellow);
    color:#141311;
    font-weight:600;
  }
  .nav-links a:not(.active):hover{
    background:#f2f2f2;
  }

  /* HERO CONTENT */
  .hero__content{
    position:relative;
    z-index:4;
    flex:1;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
  }

  .content-inner{
    width:100%;
    max-width:780px;
  }

  h1{
    font-family:'Archivo Black', Arial, sans-serif;
    font-size:clamp(2rem, 5.2vw, 4.4rem);
    line-height:1.08;
    font-weight:400;
    letter-spacing:-0.01em;
    text-transform:uppercase;
    text-align:left;
  }

  .subtitle{
    margin-top:26px;
    letter-spacing:.16em;
    text-transform:uppercase;
    font-size:.8rem;
    font-weight:500;
    color:#efefef;
    text-align:center;
  }

  .cta-wrap{
    margin-top:34px;
    display:flex;
    justify-content:center;
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:12px;
    background:var(--yellow);
    color:#141311;
    font-weight:600;
    font-size:.98rem;
    text-decoration:none;
    padding:9px 9px 9px 24px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .cta:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(242,233,11,.35);
  }
  .cta .icon{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#141311;
    color:var(--yellow);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1rem;
  }

  @media (max-width: 760px){
    nav{
      flex-wrap:wrap;
      row-gap:8px;
      padding:12px 16px;
      border-radius:24px;
      justify-content:center;
    }
    .nav-links{
      width:100%;
      justify-content:center;
      flex-wrap:wrap;
    }
    h1{text-align:left; font-size:clamp(1.6rem, 7vw, 2.2rem);}
    .hero__content{padding:32px 20px;}
  }

  @media (prefers-reduced-motion: reduce){
    .cta{transition:none;}
  }

  :focus-visible{
    outline:2px solid var(--yellow);
    outline-offset:3px;
  }
</style>
</head>
